name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin,wasm32-unknown-unknown
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-24.04
            args: ""
            targets: wasm32-unknown-unknown
          - platform: windows-latest
            args: ""
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依存パッケージ
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: cargo-bins/cargo-binstall@main

      - name: dioxus-cli と tauri-cli をインストール
        run: cargo binstall -y dioxus-cli tauri-cli

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "App ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Assets から OS に合ったインストーラーをダウンロードしてください。"
          releaseDraft: true
          prerelease: false
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
