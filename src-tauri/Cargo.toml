[package]
name = "nyanpuppu-packer"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nyanpuppu_packer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.10"
metol = { version = "0.1.0", git = "https://github.com/VillSnow/metol.git" }
ndarray = "0.17.2"
ndrustfft = "0.6.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
base64 = "0.23.1"
anyhow = "1.0.104"
url = "2"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
